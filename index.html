<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>IT英語動詞30</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f0f0f; --surface: #1c1c1e; --surface2: #2c2c2e;
  --border: rgba(255,255,255,0.1); --text: #f5f5f7; --text2: #98989d;
  --accent: #0a84ff; --accent2: #30d158; --danger: #ff453a;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, 'Hiragino Sans', sans-serif; -webkit-font-smoothing: antialiased; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* header */
#header {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 8px; padding-top: max(12px, env(safe-area-inset-top));
  background: var(--surface); border-bottom: 0.5px solid var(--border); gap: 8px;
}
#header h1 { font-size: 15px; font-weight: 600; white-space: nowrap; flex: 1; }
.hdr-btn {
  display: flex; align-items: center; gap: 5px;
  background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: 8px; padding: 6px 10px;
  font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; color: var(--text2);
}
.hdr-btn.on { color: var(--accent); }
.hdr-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.hdr-btn:active { opacity: 0.7; }

/* pdf area */
#pdf-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; background: #1a1a1a; position: relative; }
#pdf-pages { display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
#pdf-pages canvas { display: block; max-width: 100%; height: auto; border-radius: 4px; }
#pdf-pages.spread { gap: 6px; }
.spread-pair { display: flex; gap: 2px; align-items: flex-start; width: 100%; justify-content: center; }
.spread-pair canvas { border-radius: 3px; flex-shrink: 0; }

#loading-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 14px; }

#page-info {
  position: fixed; top: max(60px, calc(env(safe-area-inset-top) + 48px)); right: 12px;
  background: rgba(0,0,0,0.65); color: #fff; font-size: 12px; padding: 3px 9px;
  border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
#page-info.visible { opacity: 1; }

/* player bar */
#player-bar {
  flex-shrink: 0; background: var(--surface); border-top: 0.5px solid var(--border);
  padding: 8px 16px; padding-bottom: max(8px, env(safe-area-inset-bottom));
}
#track-info { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#track-name { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text2); }
#track-name.loaded { color: var(--text); }
#library-btn { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 7px; color: var(--accent2); font-size: 11px; font-weight: 500; padding: 4px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
#library-btn:active { opacity: 0.7; }

#progress-wrap { position: relative; margin-bottom: 4px; height: 20px; display: flex; align-items: center; }
#progress { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; background: var(--surface2); border-radius: 2px; outline: none; cursor: pointer; }
#progress::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #fff; border-radius: 50%; }
#progress-fill { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 3px; background: var(--accent); border-radius: 2px; pointer-events: none; }
#time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 6px; }

#controls { display: flex; align-items: center; justify-content: space-between; }
.ctrl-btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; border-radius: 8px; min-width: 44px; min-height: 44px; justify-content: center; }
.ctrl-btn:active { background: var(--surface2); }
.ctrl-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ctrl-btn .lbl { font-size: 10px; color: var(--text2); }
#play-btn svg { width: 28px; height: 28px; fill: currentColor; stroke: none; color: var(--accent); }
#speed-btn { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 8px; color: var(--accent2); font-size: 13px; font-weight: 600; padding: 6px 10px; cursor: pointer; min-width: 52px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
#speed-btn:active { opacity: 0.7; }

#section-row { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
#section-row::-webkit-scrollbar { display: none; }
.sec-btn { flex-shrink: 0; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 11px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.sec-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
#add-section-row { display: flex; gap: 6px; margin-top: 5px; align-items: center; }
#section-label-input { flex: 1; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 5px 8px; outline: none; }
#mark-btn { background: var(--accent); border: none; border-radius: 6px; color: #fff; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
#mark-btn:active { opacity: 0.7; }

/* Library Sheet */
#library-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); }
#library-overlay.open { display: flex; align-items: flex-end; }
#library-sheet { width: 100%; background: var(--surface); border-radius: 16px 16px 0 0; padding-bottom: max(16px, env(safe-area-inset-bottom)); max-height: 75vh; display: flex; flex-direction: column; }
#library-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
#library-header h2 { font-size: 15px; font-weight: 600; }
#library-close { background: var(--surface2); border: none; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); font-size: 16px; }
#library-close:active { opacity: 0.7; }
#library-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.lib-group-label { padding: 10px 16px 4px; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; background: var(--bg); position: sticky; top: 0; z-index: 1; }
.lib-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 0.5px solid var(--border); cursor: pointer; }
.lib-item:active { background: var(--surface2); }
.lib-item.playing { background: rgba(10,132,255,0.08); }
.lib-num { width: 28px; height: 28px; border-radius: 6px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text2); flex-shrink: 0; }
.lib-item.playing .lib-num { background: rgba(10,132,255,0.2); color: var(--accent); }
.lib-title { font-size: 13px; font-weight: 500; flex: 1; }
.lib-item.playing .lib-title { color: var(--accent); }
.lib-now { font-size: 10px; color: var(--accent); margin-top: 1px; }

audio { display: none; }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <h1>📖 IT英語動詞30</h1>
    <button id="spread-btn" class="hdr-btn" aria-label="見開き切替">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="9" height="16" rx="1"/><rect x="13" y="4" width="9" height="16" rx="1"/></svg>
      見開き
    </button>
  </header>

  <div id="pdf-area">
    <div id="loading-msg">読み込み中...</div>
    <div id="pdf-pages"></div>
  </div>
  <div id="page-info" aria-live="polite"></div>

  <div id="player-bar">
    <div id="track-info">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#30d158" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span id="track-name">トラックを選択してください</span>
      <button id="library-btn">トラック一覧 ▾</button>
    </div>
    <div id="progress-wrap">
      <div id="progress-fill" style="width:0%"></div>
      <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
    </div>
    <div id="time-row"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
    <div id="controls">
      <button class="ctrl-btn" id="back10-btn" aria-label="10秒戻す">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" stroke="none" font-weight="700">10</text></svg>
        <span class="lbl">10秒戻し</span>
      </button>
      <button class="ctrl-btn" id="play-btn" aria-label="再生">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="fwd10-btn" aria-label="10秒送り">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="14.5" text-anchor="middle" font-size="6" fill="currentColor" stroke="none" font-weight="700">10</text></svg>
        <span class="lbl">10秒送り</span>
      </button>
      <button id="speed-btn" aria-label="再生速度">1.0×</button>
    </div>
    <div id="section-row"></div>
    <div id="add-section-row">
      <input type="text" id="section-label-input" placeholder="セクション名（省略可）" maxlength="20">
      <button id="mark-btn">＋ 登録</button>
    </div>
  </div>
</div>

<!-- Library Sheet -->
<div id="library-overlay">
  <div id="library-sheet">
    <div id="library-header">
      <h2>🎵 トラック一覧</h2>
      <button id="library-close">✕</button>
    </div>
    <div id="library-list"></div>
  </div>
</div>

<audio id="audio"></audio>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── ファイル定義 ─────────────────────────────
const PDF_FILE = 'IT英語動詞30.pdf';

const TRACKS = [
  { group: 'Unit 01 — 基本動詞', file: '01_01_Do.mp3',         label: 'Do' },
  { group: 'Unit 01 — 基本動詞', file: '01_02_Have.mp3',       label: 'Have' },
  { group: 'Unit 01 — 基本動詞', file: '01_03_Get1.mp3',       label: 'Get (1)' },
  { group: 'Unit 01 — 基本動詞', file: '01_04_Get2.mp3',       label: 'Get (2)' },
  { group: 'Unit 01 — 基本動詞', file: '01_05_Get3.mp3',       label: 'Get (3)' },
  { group: 'Unit 01 — 基本動詞', file: '01_06_Give.mp3',       label: 'Give' },
  { group: 'Unit 01 — 基本動詞', file: '01_07_Make.mp3',       label: 'Make' },
  { group: 'Unit 01 — 基本動詞', file: '01_08_Take.mp3',       label: 'Take' },
  { group: 'Unit 01 — 基本動詞', file: '01_09_Put.mp3',        label: 'Put' },
  { group: 'Unit 01 — 基本動詞', file: '01_10_Go.mp3',         label: 'Go' },
  { group: 'Unit 01 — 基本動詞', file: '01_11_Come.mp3',       label: 'Come' },
  { group: 'Unit 01 — 基本動詞', file: '01_12_Look.mp3',       label: 'Look' },
  { group: 'Unit 02 — IT動詞',   file: '02_01_Be.mp3',         label: 'Be' },
  { group: 'Unit 02 — IT動詞',   file: '02_02_Need.mp3',       label: 'Need' },
  { group: 'Unit 02 — IT動詞',   file: '02_03_Work.mp3',       label: 'Work' },
  { group: 'Unit 02 — IT動詞',   file: '02_04_Find.mp3',       label: 'Find' },
  { group: 'Unit 02 — IT動詞',   file: '02_05_Run.mp3',        label: 'Run' },
  { group: 'Unit 02 — IT動詞',   file: '02_06_Follow up.mp3',  label: 'Follow up' },
  { group: 'Unit 02 — IT動詞',   file: '02_07_Update.mp3',     label: 'Update' },
  { group: 'Unit 02 — IT動詞',   file: '02_08_Help.mp3',       label: 'Help' },
  { group: 'Unit 02 — IT動詞',   file: '02_09_Happen.mp3',     label: 'Happen' },
  { group: 'Unit 02 — IT動詞',   file: '02_10_Seem.mp3',       label: 'Seem' },
  { group: 'Unit 02 — IT動詞',   file: '02_11_Discuss.mp3',    label: 'Discuss' },
  { group: 'Unit 02 — IT動詞',   file: '02_12_Learn.mp3',      label: 'Learn' },
  { group: 'Unit 02 — IT動詞',   file: '02_13_Call out.mp3',   label: 'Call out' },
  { group: 'Unit 02 — IT動詞',   file: '02_14_Block.mp3',      label: 'Block' },
  { group: 'Unit 02 — IT動詞',   file: '02_15_Capture.mp3',    label: 'Capture' },
  { group: 'Unit 02 — IT動詞',   file: '02_16_Execute.mp3',    label: 'Execute' },
  { group: 'Unit 02 — IT動詞',   file: '02_17_Conduct.mp3',    label: 'Conduct' },
  { group: 'Unit 02 — IT動詞',   file: '02_18_Store.mp3',      label: 'Store' },
  { group: 'Unit 02 — IT動詞',   file: '02_19_Talk.mp3',       label: 'Talk' },
  { group: 'Unit 02 — IT動詞',   file: '02_20_Align.mp3',      label: 'Align' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 1.mp3',  label: 'Conversation 1' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 2.mp3',  label: 'Conversation 2' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 3.mp3',  label: 'Conversation 3' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 4.mp3',  label: 'Conversation 4' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 5.mp3',  label: 'Conversation 5' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 6.mp3',  label: 'Conversation 6' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 7.mp3',  label: 'Conversation 7' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 8.mp3',  label: 'Conversation 8' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 9.mp3',  label: 'Conversation 9' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 10.mp3', label: 'Conversation 10' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 11.mp3', label: 'Conversation 11' },
  { group: 'Unit 03 — 会話練習', file: '03_Conversation 12.mp3', label: 'Conversation 12' },
];

// ── 状態 ──────────────────────────────────────
const audio = document.getElementById('audio');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const progress = document.getElementById('progress');
const progressFill = document.getElementById('progress-fill');
const currentTimeEl = document.getElementById('current-time');
const durationEl = document.getElementById('duration');
const speedBtn = document.getElementById('speed-btn');
const trackName = document.getElementById('track-name');
const backBtn = document.getElementById('back10-btn');
const fwdBtn = document.getElementById('fwd10-btn');
const sectionRow = document.getElementById('section-row');
const markBtn = document.getElementById('mark-btn');
const labelInput = document.getElementById('section-label-input');
const pageInfo = document.getElementById('page-info');
const pdfArea = document.getElementById('pdf-area');
const libraryOverlay = document.getElementById('library-overlay');
const libraryList = document.getElementById('library-list');

const speeds = [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
let speedIdx = 2;
let sections = [];
let pageInfoTimer;
let currentTrackIdx = null;
let spreadMode = false;
let currentPdfDoc = null;
let currentPdfTotal = 0;

// ── ライブラリ描画 ────────────────────────────
function renderLibrary() {
  libraryList.innerHTML = '';
  let lastGroup = '';
  TRACKS.forEach((t, i) => {
    if (t.group !== lastGroup) {
      const g = document.createElement('div');
      g.className = 'lib-group-label';
      g.textContent = t.group;
      libraryList.appendChild(g);
      lastGroup = t.group;
    }
    const item = document.createElement('div');
    item.className = 'lib-item' + (i === currentTrackIdx ? ' playing' : '');
    const numStr = String(i + 1).padStart(2, '0');
    item.innerHTML = `
      <div class="lib-num">${numStr}</div>
      <div style="flex:1;overflow:hidden">
        <div class="lib-title">${t.label}</div>
        ${i === currentTrackIdx ? '<div class="lib-now">▶ 再生中</div>' : ''}
      </div>
    `;
    item.addEventListener('click', () => { playTrack(i); closeLibrary(); });
    libraryList.appendChild(item);
  });
}

function playTrack(idx) {
  saveSections();
  currentTrackIdx = idx;
  const t = TRACKS[idx];
  audio.src = encodeURIComponent(t.file);
  audio.playbackRate = speeds[speedIdx];
  trackName.textContent = t.label;
  trackName.classList.add('loaded');
  sections = loadSectionsForTrack(idx);
  renderSections();
  audio.play().catch(() => {});
}

// ── セクション ────────────────────────────────
function sectionsKey(idx) { return 'it_sec_' + idx; }
function saveSections() {
  if (currentTrackIdx === null) return;
  try { localStorage.setItem(sectionsKey(currentTrackIdx), JSON.stringify(sections)); } catch(e) {}
}
function loadSectionsForTrack(idx) {
  try { const s = localStorage.getItem(sectionsKey(idx)); return s ? JSON.parse(s) : []; } catch(e) { return []; }
}
function renderSections() {
  sectionRow.innerHTML = '';
  sections.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'sec-btn';
    btn.textContent = s.label;
    btn.addEventListener('click', () => { audio.currentTime = s.t; });
    btn.addEventListener('contextmenu', e => { e.preventDefault(); sections.splice(i, 1); renderSections(); saveSections(); });
    sectionRow.appendChild(btn);
  });
}

// ── 音声イベント ──────────────────────────────
function fmt(s) { s = Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateProgress() {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progress.value = pct; progressFill.style.width = pct + '%';
  currentTimeEl.textContent = fmt(audio.currentTime);
  durationEl.textContent = fmt(audio.duration);
}
function setPlayIcon(p) { playIcon.innerHTML = p ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; }

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', () => { durationEl.textContent = fmt(audio.duration); });
audio.addEventListener('play', () => setPlayIcon(true));
audio.addEventListener('pause', () => setPlayIcon(false));
audio.addEventListener('ended', () => {
  setPlayIcon(false);
  // 次のトラックへ自動進行
  if (currentTrackIdx !== null && currentTrackIdx < TRACKS.length - 1) {
    playTrack(currentTrackIdx + 1);
    renderLibrary();
  }
});

playBtn.addEventListener('click', () => { if (audio.src) { audio.paused ? audio.play() : audio.pause(); } });
backBtn.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
fwdBtn.addEventListener('click', () => { audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10); });
progress.addEventListener('input', () => {
  if (audio.duration) { audio.currentTime = (progress.value/100)*audio.duration; progressFill.style.width = progress.value+'%'; }
});
speedBtn.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  audio.playbackRate = speeds[speedIdx];
  speedBtn.textContent = speeds[speedIdx].toFixed(2).replace(/\.?0+$/,'') + '×';
});
markBtn.addEventListener('click', () => {
  if (!audio.src) return;
  const t = audio.currentTime;
  sections.push({ t, label: labelInput.value.trim() || fmt(t) });
  labelInput.value = '';
  renderSections(); saveSections();
});

// ── ライブラリUI ──────────────────────────────
function openLibrary() { renderLibrary(); libraryOverlay.classList.add('open'); }
function closeLibrary() { libraryOverlay.classList.remove('open'); }
document.getElementById('library-btn').addEventListener('click', openLibrary);
document.getElementById('library-close').addEventListener('click', closeLibrary);
libraryOverlay.addEventListener('click', e => { if (e.target === libraryOverlay) closeLibrary(); });

// ── 見開きボタン ──────────────────────────────
const spreadBtn = document.getElementById('spread-btn');
spreadBtn.addEventListener('click', () => {
  spreadMode = !spreadMode;
  spreadBtn.classList.toggle('on', spreadMode);
  if (currentPdfDoc) rerenderPDF();
});

// ── PDF ──────────────────────────────────────
async function loadPDF() {
  const loadingMsg = document.getElementById('loading-msg');
  try {
    const url = encodeURIComponent(PDF_FILE);
    currentPdfDoc = await pdfjsLib.getDocument(url).promise;
    currentPdfTotal = currentPdfDoc.numPages;
    loadingMsg.style.display = 'none';
    await rerenderPDF();
  } catch(e) {
    loadingMsg.textContent = 'PDFの読み込みに失敗しました';
  }
}

async function rerenderPDF() {
  const pagesDiv = document.getElementById('pdf-pages');
  pagesDiv.innerHTML = '';
  const vw = pdfArea.clientWidth;
  if (spreadMode) {
    pagesDiv.classList.add('spread');
    for (let i = 1; i <= currentPdfTotal; ) {
      if (i === 1) {
        const c = await renderPage(i, vw - 16); c.dataset.page = i; pagesDiv.appendChild(c); i++;
      } else {
        const pair = document.createElement('div'); pair.className = 'spread-pair';
        const c1 = await renderPage(i, Math.floor((vw-8)/2)); c1.dataset.page = i; pair.appendChild(c1); i++;
        if (i <= currentPdfTotal) { const c2 = await renderPage(i, Math.floor((vw-8)/2)); c2.dataset.page = i; pair.appendChild(c2); i++; }
        pagesDiv.appendChild(pair);
      }
    }
  } else {
    pagesDiv.classList.remove('spread');
    for (let i = 1; i <= currentPdfTotal; i++) {
      const c = await renderPage(i, vw - 16); c.dataset.page = i; pagesDiv.appendChild(c);
    }
  }
  setupPageObserver(currentPdfTotal);
}

async function renderPage(pageNum, widthPx) {
  const page = await currentPdfDoc.getPage(pageNum);
  const vp0 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: widthPx / vp0.width });
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = vp.height;
  canvas.style.width = vp.width + 'px'; canvas.style.height = vp.height + 'px';
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return canvas;
}

function setupPageObserver(total) {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        pageInfo.textContent = en.target.dataset.page + ' / ' + total;
        pageInfo.classList.add('visible');
        clearTimeout(pageInfoTimer);
        pageInfoTimer = setTimeout(() => pageInfo.classList.remove('visible'), 1800);
      }
    });
  }, { threshold: 0.3 });
  document.querySelectorAll('#pdf-pages canvas[data-page]').forEach(c => obs.observe(c));
}

// ── 起動 ─────────────────────────────────────
loadPDF();
</script>
