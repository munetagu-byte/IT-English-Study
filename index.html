<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>英語学習</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f0f0f; --surface: #1c1c1e; --surface2: #2c2c2e;
  --border: rgba(255,255,255,0.1); --text: #f5f5f7; --text2: #98989d;
  --accent: #0a84ff; --accent2: #30d158; --danger: #ff453a;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, 'Hiragino Sans', sans-serif; -webkit-font-smoothing: antialiased; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* header */
#header {
  flex-shrink: 0; display: flex; align-items: center;
  padding: 12px 16px 8px; padding-top: max(12px, env(safe-area-inset-top));
  background: var(--surface); border-bottom: 0.5px solid var(--border); gap: 8px;
}
#material-btn {
  flex: 1; display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: 8px; padding: 7px 10px; cursor: pointer; overflow: hidden;
}
#material-btn:active { opacity: 0.7; }
#material-btn .icon { font-size: 16px; flex-shrink: 0; }
#material-name { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); }
#material-btn .arrow { color: var(--text2); font-size: 11px; flex-shrink: 0; }

.hdr-btn {
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
  background: var(--surface2); border: 0.5px solid var(--border);
  border-radius: 8px; padding: 6px 10px;
  font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; color: var(--text2);
}
.hdr-btn.on { color: var(--accent); border-color: var(--accent); }
.hdr-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.hdr-btn:active { opacity: 0.7; }

/* pdf area */
#pdf-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; background: #1a1a1a; position: relative; }
#pdf-pages { display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
#pdf-pages canvas { display: block; max-width: 100%; height: auto; border-radius: 4px; }
#pdf-pages.spread { gap: 6px; }
.spread-pair { display: flex; gap: 2px; align-items: flex-start; width: 100%; justify-content: center; }
.spread-pair canvas { border-radius: 3px; flex-shrink: 0; }

#loading-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text2); font-size: 14px; }
#loading-msg .spinner { width: 28px; height: 28px; border: 2px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#page-info {
  position: fixed; top: max(60px, calc(env(safe-area-inset-top) + 48px)); right: 12px;
  background: rgba(0,0,0,0.65); color: #fff; font-size: 12px; padding: 3px 9px;
  border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
#page-info.visible { opacity: 1; }

/* player bar */
#player-bar {
  flex-shrink: 0; background: var(--surface); border-top: 0.5px solid var(--border);
  padding: 8px 16px; padding-bottom: max(8px, env(safe-area-inset-bottom));
}
#track-info { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
#track-name { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text2); }
#track-name.loaded { color: var(--text); }
#library-btn { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 7px; color: var(--accent2); font-size: 11px; font-weight: 500; padding: 4px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
#library-btn:active { opacity: 0.7; }

#progress-wrap { position: relative; margin-bottom: 4px; height: 20px; display: flex; align-items: center; }
#progress { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; background: var(--surface2); border-radius: 2px; outline: none; cursor: pointer; }
#progress::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #fff; border-radius: 50%; }
#progress-fill { position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 3px; background: var(--accent); border-radius: 2px; pointer-events: none; }
#time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 6px; }

#controls { display: flex; align-items: center; justify-content: space-between; }
.ctrl-btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; border-radius: 8px; min-width: 44px; min-height: 44px; justify-content: center; }
.ctrl-btn:active { background: var(--surface2); }
.ctrl-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ctrl-btn .lbl { font-size: 10px; color: var(--text2); }
#play-btn svg { width: 28px; height: 28px; fill: currentColor; stroke: none; color: var(--accent); }
#speed-btn { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 8px; color: var(--accent2); font-size: 13px; font-weight: 600; padding: 6px 10px; cursor: pointer; min-width: 52px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
#speed-btn:active { opacity: 0.7; }

#section-row { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
#section-row::-webkit-scrollbar { display: none; }
.sec-btn { flex-shrink: 0; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 11px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.sec-btn:active { background: var(--accent); color: #fff; }
#add-section-row { display: flex; gap: 6px; margin-top: 5px; align-items: center; }
#section-label-input { flex: 1; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 5px 8px; outline: none; }
#mark-btn { background: var(--accent); border: none; border-radius: 6px; color: #fff; font-size: 12px; font-weight: 500; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
#mark-btn:active { opacity: 0.7; }

/* ── 共通シート ── */
.sheet-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); }
.sheet-overlay.open { display: flex; align-items: flex-end; }
.sheet { width: 100%; background: var(--surface); border-radius: 16px 16px 0 0; padding-bottom: max(16px, env(safe-area-inset-bottom)); max-height: 75vh; display: flex; flex-direction: column; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.sheet-header h2 { font-size: 15px; font-weight: 600; }
.sheet-close { background: var(--surface2); border: none; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text2); font-size: 16px; }
.sheet-close:active { opacity: 0.7; }
.sheet-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* 教材選択シート */
.mat-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 0.5px solid var(--border); cursor: pointer; }
.mat-item:active { background: var(--surface2); }
.mat-item.active { background: rgba(10,132,255,0.08); }
.mat-icon { font-size: 28px; flex-shrink: 0; }
.mat-meta { flex: 1; overflow: hidden; }
.mat-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mat-item.active .mat-title { color: var(--accent); }
.mat-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* ライブラリシート */
.lib-group-label { padding: 10px 16px 4px; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; background: var(--bg); position: sticky; top: 0; z-index: 1; }
.lib-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 0.5px solid var(--border); cursor: pointer; }
.lib-item:active { background: var(--surface2); }
.lib-item.playing { background: rgba(10,132,255,0.08); }
.lib-num { width: 28px; height: 28px; border-radius: 6px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text2); flex-shrink: 0; }
.lib-item.playing .lib-num { background: rgba(10,132,255,0.2); color: var(--accent); }
.lib-title { font-size: 13px; font-weight: 500; flex: 1; }
.lib-item.playing .lib-title { color: var(--accent); }
.lib-now { font-size: 10px; color: var(--accent); margin-top: 1px; }

audio { display: none; }
</style>
</head>

</div>

<!-- 教材選択シート -->
<div id="material-overlay" class="sheet-overlay">

</div>

// ══════════════════════════════════════════════
// 状態
// ══════════════════════════════════════════════
const audio = document.getElementById('audio');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const progress = document.getElementById('progress');
const progressFill = document.getElementById('progress-fill');
const currentTimeEl = document.getElementById('current-time');
const durationEl = document.getElementById('duration');
const speedBtn = document.getElementById('speed-btn');
const trackName = document.getElementById('track-name');
const sectionRow = document.getElementById('section-row');
const labelInput = document.getElementById('section-label-input');
const pageInfo = document.getElementById('page-info');
const pdfArea = document.getElementById('pdf-area');

const speeds = [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
let speedIdx = 2;
let sections = [];
let pageInfoTimer;
let currentMaterial = null;   // MATERIALSのオブジェクト
let currentTrackIdx = null;
let spreadMode = false;
let currentPdfDoc = null;
let currentPdfTotal = 0;

// ── 教材切替 ──────────────────────────────────
function selectMaterial(mat) {
  if (currentMaterial && currentMaterial.id === mat.id) { closeMaterialSheet(); return; }
  // 再生停止・セクション保存
  audio.pause(); audio.src = '';
  saveSections();
  currentMaterial = mat;
  currentTrackIdx = null;
  sections = [];
  renderSections();
  document.getElementById('material-name').textContent = mat.title;
  trackName.textContent = 'トラックを選択してください';
  trackName.classList.remove('loaded');
  closeMaterialSheet();
  loadPDF();
}

function renderMaterialList() {
  const list = document.getElementById('material-list');
  list.innerHTML = '';
  MATERIALS.forEach(mat => {
    const item = document.createElement('div');
    item.className = 'mat-item' + (currentMaterial && currentMaterial.id === mat.id ? ' active' : '');
    item.innerHTML = `
      <div class="mat-icon">${mat.icon}</div>
      <div class="mat-meta">
        <div class="mat-title">${mat.title}</div>
        <div class="mat-sub">${mat.tracks.length} トラック</div>
      </div>
    `;
    item.addEventListener('click', () => selectMaterial(mat));
    list.appendChild(item);
  });
}

function openMaterialSheet() { renderMaterialList(); document.getElementById('material-overlay').classList.add('open'); }
function closeMaterialSheet() { document.getElementById('material-overlay').classList.remove('open'); }
document.getElementById('material-btn').addEventListener('click', openMaterialSheet);
document.getElementById('material-close').addEventListener('click', closeMaterialSheet);
document.getElementById('material-overlay').addEventListener('click', e => { if (e.target === document.getElementById('material-overlay')) closeMaterialSheet(); });

// ── トラック再生 ──────────────────────────────
function playTrack(idx) {
  if (!currentMaterial) return;
  saveSections();
  currentTrackIdx = idx;
  const t = currentMaterial.tracks[idx];
  const path = currentMaterial.folder + '/' + encodeURIComponent(t.file);
  audio.src = path;
  audio.playbackRate = speeds[speedIdx];
  trackName.textContent = t.label;
  trackName.classList.add('loaded');
  sections = loadSectionsForTrack(currentMaterial.id, idx);
  renderSections();
  audio.play().catch(() => {});
}

// ── ライブラリUI ──────────────────────────────
function renderLibrary() {
  const list = document.getElementById('library-list');
  if (!currentMaterial) { list.innerHTML = '<p style="padding:20px;color:var(--text2);text-align:center;font-size:13px">教材を選択してください</p>'; return; }
  list.innerHTML = '';
  let lastGroup = '';
  currentMaterial.tracks.forEach((t, i) => {
    if (t.group !== lastGroup) {
      const g = document.createElement('div');
      g.className = 'lib-group-label';
      g.textContent = t.group;
      list.appendChild(g);
      lastGroup = t.group;
    }
    const item = document.createElement('div');
    item.className = 'lib-item' + (i === currentTrackIdx ? ' playing' : '');
    const num = String(i + 1).padStart(2, '0');
    item.innerHTML = `
      <div class="lib-num">${num}</div>
      <div style="flex:1;overflow:hidden">
        <div class="lib-title">${t.label}</div>
        ${i === currentTrackIdx ? '<div class="lib-now">▶ 再生中</div>' : ''}
      </div>
    `;
    item.addEventListener('click', () => { playTrack(i); closeLibrary(); });
    list.appendChild(item);
  });
  // 再生中アイテムへスクロール
  setTimeout(() => {
    const playing = list.querySelector('.lib-item.playing');
    if (playing) playing.scrollIntoView({ block: 'center' });
  }, 50);
}

function openLibrary() { renderLibrary(); document.getElementById('library-overlay').classList.add('open'); }
function closeLibrary() { document.getElementById('library-overlay').classList.remove('open'); }
document.getElementById('library-btn').addEventListener('click', openLibrary);
document.getElementById('library-close').addEventListener('click', closeLibrary);
document.getElementById('library-overlay').addEventListener('click', e => { if (e.target === document.getElementById('library-overlay')) closeLibrary(); });

// ── セクション ────────────────────────────────
function sectionsKey(matId, idx) { return `sec_${matId}_${idx}`; }
function saveSections() {
  if (!currentMaterial || currentTrackIdx === null) return;
  try { localStorage.setItem(sectionsKey(currentMaterial.id, currentTrackIdx), JSON.stringify(sections)); } catch(e) {}
}
function loadSectionsForTrack(matId, idx) {
  try { const s = localStorage.getItem(sectionsKey(matId, idx)); return s ? JSON.parse(s) : []; } catch(e) { return []; }
}
function renderSections() {
  sectionRow.innerHTML = '';
  sections.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'sec-btn';
    btn.textContent = s.label;
    btn.addEventListener('click', () => { audio.currentTime = s.t; });
    btn.addEventListener('contextmenu', e => { e.preventDefault(); sections.splice(i, 1); renderSections(); saveSections(); });
    sectionRow.appendChild(btn);
  });
}
document.getElementById('mark-btn').addEventListener('click', () => {
  if (!audio.src) return;
  sections.push({ t: audio.currentTime, label: labelInput.value.trim() || fmt(audio.currentTime) });
  labelInput.value = '';
  renderSections(); saveSections();
});

// ── 音声イベント ──────────────────────────────
function fmt(s) { s = Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function updateProgress() {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progress.value = pct; progressFill.style.width = pct + '%';
  currentTimeEl.textContent = fmt(audio.currentTime);
  durationEl.textContent = fmt(audio.duration);
}
function setPlayIcon(p) { playIcon.innerHTML = p ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>'; }

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', () => { durationEl.textContent = fmt(audio.duration); });
audio.addEventListener('play', () => setPlayIcon(true));
audio.addEventListener('pause', () => setPlayIcon(false));
audio.addEventListener('ended', () => {
  setPlayIcon(false);
  if (!currentMaterial || currentTrackIdx === null) return;
  if (currentTrackIdx < currentMaterial.tracks.length - 1) {
    playTrack(currentTrackIdx + 1);
    renderLibrary();
  }
});

playBtn.addEventListener('click', () => { if (audio.src) { audio.paused ? audio.play() : audio.pause(); } });
document.getElementById('back10-btn').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
document.getElementById('fwd10-btn').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10); });
progress.addEventListener('input', () => {
  if (audio.duration) { audio.currentTime = (progress.value/100)*audio.duration; progressFill.style.width = progress.value+'%'; }
});
speedBtn.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  audio.playbackRate = speeds[speedIdx];
  speedBtn.textContent = speeds[speedIdx].toFixed(2).replace(/\.?0+$/,'') + '×';
});

// ── 見開き ────────────────────────────────────
const spreadBtn = document.getElementById('spread-btn');
spreadBtn.addEventListener('click', () => {
  spreadMode = !spreadMode;
  spreadBtn.classList.toggle('on', spreadMode);
  if (currentPdfDocs.length > 0) rerenderPDF();
});

// ── PDF ──────────────────────────────────────
// currentPdfDoc は単一 or 配列に対応
// pdfFiles: string | string[]

let currentPdfDocs = [];   // 複数ファイル対応（常に配列で管理）
let currentPdfTotal = 0;
// 後方互換のため currentPdfDoc は最初の1件を指す
let currentPdfDoc = null;

async function loadPDF() {
  const loadingMsg = document.getElementById('loading-msg');
  const pagesDiv = document.getElementById('pdf-pages');
  loadingMsg.style.display = 'flex';
  loadingMsg.innerHTML = '<div class="spinner"></div><span>PDF読み込み中...</span>';
  pagesDiv.innerHTML = '';
  currentPdfDocs = [];
  currentPdfTotal = 0;
  try {
    const pdfDef = currentMaterial.pdf;
    const files = Array.isArray(pdfDef) ? pdfDef : [pdfDef];
    for (const filename of files) {
      const url = currentMaterial.folder + '/' + encodeURIComponent(filename);
      const doc = await pdfjsLib.getDocument(url).promise;
      currentPdfDocs.push(doc);
      currentPdfTotal += doc.numPages;
    }
    currentPdfDoc = currentPdfDocs[0];
    loadingMsg.style.display = 'none';
    await rerenderPDF();
  } catch(e) {
    loadingMsg.innerHTML = '<span>PDFの読み込みに失敗しました</span>';
  }
}

// グローバルページ番号（1始まり）→ {doc, localPage} に変換
function resolveGlobalPage(globalPage) {
  let offset = 0;
  for (const doc of currentPdfDocs) {
    if (globalPage <= offset + doc.numPages) {
      return { doc, localPage: globalPage - offset };
    }
    offset += doc.numPages;
  }
  return null;
}

async function rerenderPDF() {
  const pagesDiv = document.getElementById('pdf-pages');
  pagesDiv.innerHTML = '';
  const vw = pdfArea.clientWidth;
  if (spreadMode) {
    pagesDiv.classList.add('spread');
    for (let i = 1; i <= currentPdfTotal; ) {
      if (i === 1) {
        const c = await renderGlobalPage(i, vw - 16); c.dataset.page = i; pagesDiv.appendChild(c); i++;
      } else {
        const pair = document.createElement('div'); pair.className = 'spread-pair';
        const c1 = await renderGlobalPage(i, Math.floor((vw-8)/2)); c1.dataset.page = i; pair.appendChild(c1); i++;
        if (i <= currentPdfTotal) { const c2 = await renderGlobalPage(i, Math.floor((vw-8)/2)); c2.dataset.page = i; pair.appendChild(c2); i++; }
        pagesDiv.appendChild(pair);
      }
    }
  } else {
    pagesDiv.classList.remove('spread');
    for (let i = 1; i <= currentPdfTotal; i++) {
      const c = await renderGlobalPage(i, vw - 16); c.dataset.page = i; pagesDiv.appendChild(c);
    }
  }
  setupPageObserver(currentPdfTotal);
}

async function renderGlobalPage(globalPage, widthPx) {
  const resolved = resolveGlobalPage(globalPage);
  if (!resolved) return document.createElement('canvas');
  const page = await resolved.doc.getPage(resolved.localPage);
  const vp0 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: widthPx / vp0.width });
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = vp.height;
  canvas.style.width = vp.width + 'px'; canvas.style.height = vp.height + 'px';
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return canvas;
}

function setupPageObserver(total) {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        pageInfo.textContent = en.target.dataset.page + ' / ' + total;
        pageInfo.classList.add('visible');
        clearTimeout(pageInfoTimer);
        pageInfoTimer = setTimeout(() => pageInfo.classList.remove('visible'), 1800);
      }
    });
  }, { threshold: 0.3 });
  document.querySelectorAll('#pdf-pages canvas[data-page]').forEach(c => obs.observe(c));
}
